[package]
name = "ewb-test-harness"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "ewb-test-harness"
path = "src/main.rs"

[lib]
name = "ewb_test_harness"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
uuid = { version = "1.18", features = ["serde", "v4"] }
wait-timeout = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Wdk_System_SystemServices"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
