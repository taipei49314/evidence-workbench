[package]
name = "evidence-workbench"
version = "0.2.0"
edition = "2024"
description = "Thin, authority-preserving orchestration for evidence-producing tools"
publish = false
license = "Apache-2.0"
repository = "https://github.com/taipei49314/evidence-workbench"
exclude = ["tests/**"]

[features]
default = []

[[bin]]
name = "ewb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
uuid = { version = "1.18", features = ["serde", "v4"] }
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
