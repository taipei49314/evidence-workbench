name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / rust stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test production crate
        run: cargo test --locked --all-targets --all-features
      - name: Test excluded execution-boundary harness
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath tests/harness/Cargo.toml) {
            cargo test --locked --manifest-path tests/harness/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  msrv:
    name: ${{ matrix.os }} / rust 1.85
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        shell: pwsh
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Select Rust 1.85 toolchain
        shell: pwsh
        run: rustup default 1.85.0
      - name: Test production crate on MSRV
        run: cargo test --locked --all-targets --all-features
      - name: Test excluded execution-boundary harness on MSRV
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath tests/harness/Cargo.toml) {
            cargo test --locked --manifest-path tests/harness/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  package:
    name: packaged-source boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record builder-asserted VCS base
        shell: pwsh
        run: |
          $commit = (& git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "cannot resolve package commit" }
          $tree = (& git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "cannot resolve package tree" }
          $dirty = @(& git status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw "package checkout is not clean" }
          "EWB_BUILD_VCS_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EWB_BUILD_VCS_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EWB_BUILD_VCS_DIRTY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tags = @(& git tag --points-at HEAD)
          if ($LASTEXITCODE -ne 0) { throw "cannot inspect package tags" }
          $tags = @($tags | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
          if ($tags.Count -eq 1) {
            "EWB_BUILD_VCS_TAG=$($tags[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Verify package contents and build
        run: cargo package --locked
      - name: Install packaged production binary
        shell: pwsh
        run: |
          $sources = @(Get-ChildItem -LiteralPath target/package -Directory | Where-Object Name -Like 'evidence-workbench-*')
          if ($sources.Count -ne 1) { throw "expected one extracted evidence-workbench package source" }
          cargo install --locked --path $sources[0].FullName --root target/ci-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged build identity
        shell: pwsh
        run: |
          $binary = 'target/ci-install/bin/ewb'
          $build = & $binary --json build show | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $build.ok -or $build.command -ne 'build.show') {
            throw "packaged build show failed"
          }
          if ($build.data.schema_version -ne 'build_identity/v1') { throw "unexpected build schema" }
          if ($build.data.vcs_base.reporting_state -ne 'builder_asserted') { throw "VCS base was not builder asserted" }
          if ($build.data.vcs_base.scope -ne 'builder_recorded_vcs_base') { throw "VCS scope overclaims packaged source" }
          if ($build.data.vcs_base.commit -ne $env:EWB_BUILD_VCS_COMMIT) { throw "packaged commit base drifted" }
          if ($build.data.vcs_base.tree -ne $env:EWB_BUILD_VCS_TREE) { throw "packaged tree base drifted" }
          if ($build.data.vcs_base.dirty -ne $false) { throw "clean package base became dirty" }
          if ([string]::IsNullOrWhiteSpace($env:EWB_BUILD_VCS_TAG)) {
            if ($null -ne $build.data.vcs_base.exact_tag) { throw "packaged build guessed an exact tag" }
          } elseif ($build.data.vcs_base.exact_tag -ne $env:EWB_BUILD_VCS_TAG) {
            throw "packaged exact tag drifted"
          }
          $sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($build.data.executable.sha256 -ne $sha256) { throw "packaged executable digest drifted" }
          if ($build.data.executable.byte_length -ne (Get-Item -LiteralPath $binary).Length) {
            throw "packaged executable length drifted"
          }
      - name: Verify production registry remains fail-closed
        shell: pwsh
        run: |
          $tools = & target/ci-install/bin/ewb --json tools list | ConvertFrom-Json
          if (-not $tools.ok) { throw "tools list failed" }
          # Linux cannot create Windows native plans, so planning_supported remains zero here.
          if (@($tools.data | Where-Object planning_supported).Count -ne 0) {
            throw "a Windows-only production adapter became runnable on Linux"
          }
          $ready = @($tools.data | Where-Object { $_.upstream_pin.execution_readiness.state -eq 'ready' })
          if ($ready.Count -ne 1 -or $ready[0].manifest_id -ne 'tomorrowci-lab') {
            throw "expected exactly the qualification-gated TomorrowCI upstream delivery to be ready"
          }
          if (@($tools.data | Where-Object { $_.upstream_pin.authority_effect -ne 'none' }).Count -ne 0) {
            throw "an upstream pin acquired authority"
          }
